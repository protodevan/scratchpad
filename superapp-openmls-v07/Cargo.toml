[package]
name = "superapp-openmls-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
openmls = "=0.9.0"
openmls_basic_credential = { version = "=0.6.0", features = ["clonable"] }
openmls_rust_crypto = "=0.6.0"
openmls_sqlite_storage = "=0.3.0"
openmls_traits = "=0.6.0"
tls_codec = { version = "0.5", features = ["derive", "serde", "mls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
